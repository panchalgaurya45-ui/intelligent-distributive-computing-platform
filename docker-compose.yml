services:
  master:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      HEARTBEAT_TIMEOUT_SECONDS: "15"
      OFFLINE_CHECK_INTERVAL_SECONDS: "2"
      WORKER_TASK_TIMEOUT_SECONDS: "30"
      # One parent-dispatch thread plus up to three concurrent subtasks.
      TASK_DISPATCH_WORKERS: "4"
      LOG_LEVEL: INFO
    restart: unless-stopped
    networks:
      - idcp-network

  node-01:
    build:
      context: ./node-agent
    environment:
      NODE_ID: node-01
      MASTER_URL: http://master:5000
      WORKER_URL: http://node-01:5001
      WORKER_PORT: "5001"
      HEARTBEAT_INTERVAL_SECONDS: "5"
      REQUEST_TIMEOUT_SECONDS: "3"
      LOG_LEVEL: INFO
    depends_on:
      - master
    restart: unless-stopped
    networks:
      - idcp-network

  node-02:
    build:
      context: ./node-agent
    environment:
      NODE_ID: node-02
      MASTER_URL: http://master:5000
      WORKER_URL: http://node-02:5001
      WORKER_PORT: "5001"
      HEARTBEAT_INTERVAL_SECONDS: "5"
      REQUEST_TIMEOUT_SECONDS: "3"
      LOG_LEVEL: INFO
    depends_on:
      - master
    restart: unless-stopped
    networks:
      - idcp-network

  node-03:
    build:
      context: ./node-agent
    environment:
      NODE_ID: node-03
      MASTER_URL: http://master:5000
      WORKER_URL: http://node-03:5001
      WORKER_PORT: "5001"
      HEARTBEAT_INTERVAL_SECONDS: "5"
      REQUEST_TIMEOUT_SECONDS: "3"
      LOG_LEVEL: INFO
    depends_on:
      - master
    restart: unless-stopped
    networks:
      - idcp-network

networks:
  idcp-network:
    driver: bridge
